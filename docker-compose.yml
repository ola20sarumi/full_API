# Runs the API with its own SQL Server. Usage:
#   docker compose up --build
# then open http://localhost:8080/swagger
services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD:-LocalDev_Passw0rd!}
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__FullConnectionString: "Server=db;Database=FullDb;User Id=sa;Password=${SA_PASSWORD:-LocalDev_Passw0rd!};TrustServerCertificate=True"
      Database__MigrateOnStartup: "true"
    ports:
      - "8080:8080"
